# Publica a pasta cyron/ no Cloudflare Pages (cyronbot.pages.dev).
#
# Pelo painel da Cloudflare a conexão com o GitHub não fechava no celular,
# então quem publica é o próprio GitHub: a cada mudança em cyron/ na main,
# o wrangler sobe a pasta como está (o site é estático, não tem build).
#
# Precisa de UM segredo no repositório: CLOUDFLARE_API_TOKEN, com a permissão
# "Conta → Cloudflare Pages → Editar". Sem ele o job só avisa e fica verde:
# o site antigo, no GitHub Pages, continua no ar de qualquer jeito.

name: Site no Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "cyron/**"
      - ".github/workflows/site-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: site-cloudflare
  cancel-in-progress: true

env:
  PROJETO: cyronbot
  # O ID da conta não é segredo: aparece em qualquer URL do painel.
  CLOUDFLARE_ACCOUNT_ID: dba5c6c74c7a4bf3bdde8ba11a9f6172

jobs:
  publicar:
    name: publicar o site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: conferir o token
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Falta o segredo CLOUDFLARE_API_TOKEN; nada foi publicado."
            echo "tem=nao" >> "$GITHUB_OUTPUT"
          else
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.tem == 'sim'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.tem == 'sim'
        with:
          node-version: "20"

      # Na primeira vez o projeto ainda não existe; depois disso o comando
      # responde "já existe" e seguimos.
      - name: criar o projeto (só na primeira vez)
        if: steps.token.outputs.tem == 'sim'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 pages project create "$PROJETO" --production-branch=main || true

      - name: publicar cyron/
        if: steps.token.outputs.tem == 'sim'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 pages deploy cyron --project-name="$PROJETO" --branch=main --commit-dirty=true
