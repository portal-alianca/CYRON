<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CYRON — Criar personagem</title>
<meta name="theme-color" content="#1E1F22">
<link rel="icon" href="../img/cyron.png">
<style>
/* O criador de personagem do jogo do CYRON.

   Quem desenha o 3D e' o aparelho de quem esta' criando, e nao o bot: a
   maquina do CYRON tem 256 MB e nao roda um navegador. Por isso o criador
   mora no site -- o bot so' recebe as escolhas (e a foto, quando enviar
   para o Discord existir).

   Os modelos sao do Quaternius, CC0 (dominio publico): sem custo e sem
   credito obrigatorio. As licencas estao em m/LICENSE-*.txt. */
:root{
  --fundo:#1E1F22; --painel:#2B2D31; --campo:#383A40; --borda:#3F4147;
  --texto:#DBDEE1; --forte:#F2F3F5; --fraco:#949BA4; --blurple:#5865F2; --verde:#23A55A;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; background:var(--fundo); color:var(--texto);
  font:15px/1.4 "gg sans","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100dvh; max-width:1100px; margin:0 auto}
@media (min-width:900px){ .app{grid-template-columns:minmax(0,1fr) 380px; grid-template-rows:auto minmax(0,1fr)} .topo{grid-column:1/-1} .painel{grid-row:2; grid-column:2} }
.topo{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #111214}
.topo img{width:32px; height:32px; border-radius:50%}
.topo b{color:var(--forte)}
.topo span{color:var(--fraco); font-size:13px}
.palco{position:relative; min-height:0; background:radial-gradient(60% 55% at 50% 45%,#3a4a8a 0%,#1d2140 55%,#121320 100%)}
.palco canvas{display:block; width:100%; height:100%; touch-action:none}
.carregando{position:absolute; inset:0; display:grid; place-items:center; color:var(--forte); font-weight:600; pointer-events:none}
.dica{position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:12px; color:#c9d0ff; opacity:.7; pointer-events:none}
.painel{background:var(--painel); border-top:1px solid #111214; display:flex; flex-direction:column; min-height:0; max-height:46dvh}
@media (min-width:900px){ .painel{max-height:none; border-top:0; border-left:1px solid #111214} }
.abas{display:flex; gap:4px; padding:8px; overflow-x:auto; scrollbar-width:none}
.abas button{flex:0 0 auto; background:none; border:0; color:var(--fraco); font:600 14px/1 inherit; padding:9px 12px; border-radius:6px; cursor:pointer}
.abas button[aria-pressed="true"]{background:var(--campo); color:var(--forte)}
.conteudo{padding:4px 14px 14px; overflow-y:auto; flex:1}
.grupo{margin:12px 0 6px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--fraco)}
.opcoes{display:flex; flex-wrap:wrap; gap:8px}
.op{background:var(--campo); color:var(--texto); border:2px solid transparent; border-radius:8px; padding:9px 12px; font:500 14px/1 inherit; cursor:pointer}
.op[aria-pressed="true"]{border-color:var(--blurple); color:var(--forte); background:#404475}
.cor{width:38px; height:38px; border-radius:50%; border:3px solid transparent; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.cor[aria-pressed="true"]{border-color:#fff; box-shadow:0 0 0 2px var(--blurple)}
input[type=text]{width:100%; background:var(--fundo); color:var(--forte); border:1px solid var(--borda); border-radius:8px; padding:11px 12px; font:inherit; font-size:16px}
.acoes{display:flex; gap:8px; padding:10px 14px; border-top:1px solid #1f2023}
.bt{flex:1; height:42px; border:0; border-radius:8px; font:600 14px/1 inherit; color:#fff; background:#4E5058; cursor:pointer}
.bt-1{background:var(--blurple)}
.bt[disabled]{opacity:.5; cursor:not-allowed}
.nota{font-size:12px; color:var(--fraco); margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <img src="../img/cyron.png" alt="">
    <div><b>Criar personagem</b><br><span>CYRON · versão de teste</span></div>
  </header>

  <div class="palco" id="palco">
    <div class="carregando" id="carregando">Carregando…</div>
    <div class="dica">Arraste para girar · pinça para aproximar</div>
  </div>

  <section class="painel">
    <nav class="abas" id="abas">
      <button data-aba="corpo" aria-pressed="true">🧍 Corpo</button>
      <button data-aba="cabelo" aria-pressed="false">💇 Cabelo</button>
      <button data-aba="roupa" aria-pressed="false">🛡️ Roupa</button>
      <button data-aba="nome" aria-pressed="false">✏️ Nome</button>
    </nav>
    <div class="conteudo" id="conteudo"></div>
    <div class="acoes">
      <button class="bt" id="aleatorio">🎲 Aleatório</button>
      <button class="bt" id="foto">📸 Foto</button>
      <button class="bt bt-1" id="enviar" disabled title="Em breve">Enviar ao Discord</button>
    </div>
  </section>
</div>

<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

/* ---------- as opcoes ---------- */
const OPCOES = {
  sexo: [["f", "Feminino"], ["m", "Masculino"]],
  pele: [["#fff1e6", "clara"], ["#f3d2b8", "rosada"], ["#ffffff", "media", "escura"], ["#e2bfa2", "morena", "escura"], ["#a8795c", "escura", "escura"]],
  cabelo: { f: [["Hair_Long", "Longo"], ["Hair_Buns", "Coque"], ["Hair_BuzzedFemale", "Raspado"], ["nenhum", "Careca"]],
            m: [["Hair_SimpleParted", "Repartido"], ["Hair_Buzzed", "Raspado"], ["Hair_Long", "Longo"], ["nenhum", "Careca"]] },
  corCabelo: ["#1c1714", "#5a3825", "#a5672f", "#e6c36a", "#f2f2f2", "#d9483b", "#ff7eb6", "#7a5cff", "#2f6bff", "#2dd4bf"],
  roupa: [["Ranger", "Arqueiro"], ["Peasant", "Camponês"]],
  variante: [["a", "Cor 1"], ["b", "Cor 2"]],
};
const estado = { sexo: "f", pele: 0, cabelo: "Hair_Long", corCabelo: "#e6c36a", barba: false, roupa: "Ranger", variante: "a", capuz: true, ombreira: true, nome: "" };

/* ---------- a cena ---------- */
const palco = document.getElementById("palco");
const render = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
render.setPixelRatio(Math.min(devicePixelRatio, 2));
render.outputColorSpace = THREE.SRGBColorSpace;
render.toneMapping = THREE.ACESFilmicToneMapping;
palco.prepend(render.domElement);
const cena = new THREE.Scene();
cena.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a2a40, 1.6));
const sol = new THREE.DirectionalLight(0xffffff, 2.4); sol.position.set(2, 4, 3); cena.add(sol);
const recorte = new THREE.DirectionalLight(0x9b7bff, 1.8); recorte.position.set(-3, 2, -2); cena.add(recorte);
const chao = new THREE.Mesh(new THREE.RingGeometry(0.45, 0.5, 64), new THREE.MeshBasicMaterial({ color: 0xc9d0ff, transparent: true, opacity: 0.5 }));
chao.rotation.x = -Math.PI / 2; chao.position.y = 0.005; cena.add(chao);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
camera.position.set(0.9, 1.3, 4.2);
const controles = new OrbitControls(camera, render.domElement);
controles.target.set(0, 0.95, 0); controles.enablePan = false;
controles.minDistance = 1.6; controles.maxDistance = 6; controles.autoRotate = true; controles.autoRotateSpeed = 1.2;
controles.addEventListener("start", () => { controles.autoRotate = false; });
function tamanho() {
  const w = palco.clientWidth, h = palco.clientHeight;
  render.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(tamanho).observe(palco);
(function loop() { controles.update(); render.render(cena, camera); requestAnimationFrame(loop); })();

/* ---------- carregar pecas (com memoria) ---------- */
const loader = new GLTFLoader();
const memoria = new Map();
function peca(nome) {
  if (!memoria.has(nome)) memoria.set(nome, new Promise((ok, erro) => loader.load(`./m/${nome}.glb`, ok, undefined, erro)));
  /* SkeletonUtils, e nao clone(): o clone comum deixa a malha presa ao
     esqueleto do original, e a pose nao pega na copia. */
  return memoria.get(nome).then((g) => SkeletonUtils.clone(g.scene));
}
const texturas = new Map();
function textura(nome) {
  if (!texturas.has(nome)) texturas.set(nome, new THREE.TextureLoader().loadAsync(`./m/${nome}.webp`).then((t) => {
    t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; return t; }));
  return texturas.get(nome);
}

/* O cabelo vem castanho na textura. Para pintar de qualquer cor, a textura
   vira cinza claro uma vez, e a cor escolhida entra multiplicando. */
const cinzas = new WeakMap();
function emCinza(tex) {
  if (!tex?.image) return tex;
  if (cinzas.has(tex)) return cinzas.get(tex);
  const img = tex.image, c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const l = Math.min(255, (0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2]) * 2.1);
    p[i] = p[i + 1] = p[i + 2] = l;
  }
  x.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c); t.flipY = tex.flipY; t.colorSpace = THREE.SRGBColorSpace;
  cinzas.set(tex, t); return t;
}

/* Pose: bracos para baixo, nao a pose em T dos modelos. */
const POSE = { upperarm_l: [0, 0, -1.15], upperarm_r: [0, 0, 1.15], lowerarm_l: [0, -0.25, 0], lowerarm_r: [0, 0.25, 0] };
function posar(raiz) {
  raiz.traverse((o) => { if (o.isBone && POSE[o.name]) { const [x, y, z] = POSE[o.name]; o.rotation.x += x; o.rotation.y += y; o.rotation.z += z; } });
}
/* A roupa um tiquinho por fora do corpo, para a pele nao atravessar. */
function inflar(raiz, d) {
  raiz.traverse((o) => {
    if (!o.isSkinnedMesh || o.userData.inflado) return;
    o.geometry = o.geometry.clone(); o.geometry.computeVertexNormals();
    const p = o.geometry.attributes.position, n = o.geometry.attributes.normal;
    for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + n.getX(i) * d, p.getY(i) + n.getY(i) * d, p.getZ(i) + n.getZ(i) * d);
    p.needsUpdate = true; o.userData.inflado = true;
  });
}

/* O corpo base aparece so' da cabeca para cima e nas maos: o resto fica por
   baixo da roupa, e corpo musculoso atravessaria o tecido. O corte usa a
   posicao de descanso (pose em T) de cada ponto, e o pescoco e o pulso saem
   do proprio esqueleto. */
function esconderSobARoupa(malha) {
  const sk = malha.skeleton; if (!sk) return;
  const ondeEsta = (nome) => {
    const i = sk.bones.findIndex((b) => b.name === nome); if (i < 0) return null;
    return new THREE.Vector3().setFromMatrixPosition(sk.boneInverses[i].clone().invert());
  };
  const pescoco = ondeEsta("neck_01"), pulso = ondeEsta("hand_l");
  if (!pescoco || !pulso) return;
  const corteY = pescoco.y - 0.02, corteX = Math.abs(pulso.x) - 0.02;
  malha.material.onBeforeCompile = (sh) => {
    sh.vertexShader = "varying vec3 vRepouso;\n" + sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\nvRepouso = position;");
    sh.fragmentShader = "varying vec3 vRepouso;\n" + sh.fragmentShader.replace("void main() {",
      `void main() {\n if (vRepouso.y < ${corteY.toFixed(4)} && abs(vRepouso.x) < ${corteX.toFixed(4)}) discard;`);
  };
  malha.material.needsUpdate = true;
}

let personagem = null, montando = 0;
async function montar() {
  const minha = ++montando;
  const s = estado.sexo, roupa = `roupa_${s === "f" ? "Female" : "Male"}_${estado.roupa}`;
  const cabelo = OPCOES.cabelo[s].some(([k]) => k === estado.cabelo) ? estado.cabelo : OPCOES.cabelo[s][0][0];
  estado.cabelo = cabelo;
  const nomes = [`corpo_${s}`, roupa];
  if (cabelo !== "nenhum") nomes.push(cabelo);
  if (s === "m" && estado.barba) nomes.push("Hair_Beard");
  const [partes, peleClara] = await Promise.all([Promise.all(nomes.map(peca)), textura(`pele_${s}_clara`)]);
  if (minha !== montando) return;
  const g = new THREE.Group();
  const [pr, cor, tipo] = OPCOES.pele[estado.pele];
  partes.forEach((p, i) => {
    if (i === 1) inflar(p, 0.014);
    p.traverse((o) => {
      if (!o.isMesh) return;
      o.material = o.material.clone();
      const n = o.name;
      if (i === 0 && /Superhero/.test(n)) { if (tipo !== "escura") o.material.map = peleClara; o.material.color.set(pr); esconderSobARoupa(o); }
      /* A pele que vem junto da roupa (bracos, maos) acompanha o tom escolhido. */
      if (i === 1 && /Regular/.test(o.material.name || "")) o.material.color.set(pr);
      if (i === 1) {
        if (/Hood/.test(n)) o.visible = estado.capuz;
        if (/Pauldron/.test(n)) o.visible = estado.ombreira;
      }
      if (i >= 2 || (i === 0 && /Eyebrows/.test(n))) { o.material.map = emCinza(o.material.map); o.material.color.set(estado.corCabelo); }
    });
    g.add(p);
  });
  if (estado.variante === "b") {
    const t = await textura(estado.roupa === "Ranger" ? "ranger_b" : "peasant_b");
    g.children[1].traverse((o) => { if (o.isMesh && o.material.map && !/Regular/.test(o.material.name || "") && /Ranger|Peasant/.test(o.material.name || o.name)) o.material.map = t; });
  }
  if (minha !== montando) return;
  posar(g);
  if (personagem) cena.remove(personagem);
  personagem = g; cena.add(g);
  document.getElementById("carregando").style.display = "none";
}

/* ---------- o painel ---------- */
const conteudo = document.getElementById("conteudo");
let aba = "corpo";
const botao = (rotulo, ativo, aoClicar) => {
  const b = document.createElement("button"); b.className = "op"; b.textContent = rotulo;
  b.setAttribute("aria-pressed", String(ativo)); b.onclick = aoClicar; return b;
};
const bolinha = (cor, ativo, aoClicar) => {
  const b = document.createElement("button"); b.className = "cor"; b.style.background = cor;
  b.setAttribute("aria-pressed", String(ativo)); b.setAttribute("aria-label", cor); b.onclick = aoClicar; return b;
};
function grupo(titulo, itens) {
  const t = document.createElement("div"); t.className = "grupo"; t.textContent = titulo;
  const o = document.createElement("div"); o.className = "opcoes"; itens.forEach((i) => o.appendChild(i));
  conteudo.append(t, o);
}
const mudar = (k, v) => { estado[k] = v; desenharPainel(); montar(); };
function desenharPainel() {
  conteudo.innerHTML = "";
  if (aba === "corpo") {
    grupo("Corpo", OPCOES.sexo.map(([k, r]) => botao(r, estado.sexo === k, () => mudar("sexo", k))));
    grupo("Pele", OPCOES.pele.map(([c, , t], i) => bolinha(t === "escura" && c === "#ffffff" ? "#b9805a" : t === "escura" ? c : c, estado.pele === i, () => mudar("pele", i))));
  }
  if (aba === "cabelo") {
    grupo("Estilo", OPCOES.cabelo[estado.sexo].map(([k, r]) => botao(r, estado.cabelo === k, () => mudar("cabelo", k))));
    grupo("Cor", OPCOES.corCabelo.map((c) => bolinha(c, estado.corCabelo === c, () => mudar("corCabelo", c))));
    if (estado.sexo === "m") grupo("Barba", [botao("Com barba", estado.barba, () => mudar("barba", true)), botao("Sem barba", !estado.barba, () => mudar("barba", false))]);
  }
  if (aba === "roupa") {
    grupo("Roupa", OPCOES.roupa.map(([k, r]) => botao(r, estado.roupa === k, () => mudar("roupa", k))));
    grupo("Cor da roupa", OPCOES.variante.map(([k, r]) => botao(r, estado.variante === k, () => mudar("variante", k))));
    if (estado.roupa === "Ranger") {
      grupo("Capuz", [botao("Com capuz", estado.capuz, () => mudar("capuz", true)), botao("Sem capuz", !estado.capuz, () => mudar("capuz", false))]);
      grupo("Ombreira", [botao("Com", estado.ombreira, () => mudar("ombreira", true)), botao("Sem", !estado.ombreira, () => mudar("ombreira", false))]);
    }
  }
  if (aba === "nome") {
    const t = document.createElement("div"); t.className = "grupo"; t.textContent = "Nome do personagem";
    const i = document.createElement("input"); i.type = "text"; i.maxLength = 20; i.placeholder = "Ex.: Lyra"; i.value = estado.nome;
    i.oninput = () => { estado.nome = i.value; };
    const n = document.createElement("p"); n.className = "nota";
    n.textContent = "Versão de teste: o personagem ainda não vai para o Discord. Use 📸 Foto para salvar a imagem.";
    conteudo.append(t, i, n);
  }
}
document.getElementById("abas").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  aba = b.dataset.aba;
  document.querySelectorAll("#abas button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  desenharPainel();
};
const sortear = (lista) => lista[Math.floor(Math.random() * lista.length)];
document.getElementById("aleatorio").onclick = () => {
  estado.sexo = sortear(["f", "m"]);
  estado.pele = Math.floor(Math.random() * OPCOES.pele.length);
  estado.cabelo = sortear(OPCOES.cabelo[estado.sexo])[0];
  estado.corCabelo = sortear(OPCOES.corCabelo);
  estado.barba = Math.random() < 0.4;
  estado.roupa = sortear(OPCOES.roupa)[0];
  estado.variante = sortear(["a", "b"]);
  estado.capuz = Math.random() < 0.5; estado.ombreira = Math.random() < 0.6;
  desenharPainel(); montar();
};
document.getElementById("foto").onclick = () => {
  render.render(cena, camera);
  const a = document.createElement("a");
  a.href = render.domElement.toDataURL("image/png");
  a.download = `${(estado.nome || "personagem").replace(/[^\w-]+/g, "_")}.png`;
  a.click();
};
window.ESTADO = estado; window.montar = montar;
desenharPainel(); montar().catch((e) => { document.getElementById("carregando").textContent = "Não consegui carregar: " + e.message; });
</script>
</body>
</html>
